name: Verify curated repositories

on:
  schedule:
    - cron: '43 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: repository-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh material repository observations
        id: verify
        run: node scripts/verify.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run validate && npm run build && npm run smoke
      - name: Open or update a bounded verification report pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ github.token }}
          branch: automation/repository-verification-report
          delete-branch: false
          add-paths: data/observed.json
          base: main
          sign-commits: true
          commit-message: 'chore: update curated repository observations'
          title: 'Curated repository verification report'
          body: |
            Automated factual changes and/or temporary verification failures for curated repositories. Failures are tracked separately; prior observations and editorial content are preserved.
